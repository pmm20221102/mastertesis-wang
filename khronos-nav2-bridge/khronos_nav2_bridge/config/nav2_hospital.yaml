map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: hospital_nav2_maps/hospital_p1000/floor_0/map.yaml
    topic_name: /map
    frame_id: map
    map_qos_reliability: reliable
    map_qos_durability: transient_local
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased: {plugin: nav2_navfn_planner::NavfnPlanner, tolerance: 0.2, use_astar: false, allow_unknown: false}
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: [progress_checker]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 30.0
    controller_plugins: [FollowPath]
    goal_checker_plugins: [goal_checker]
    goal_checker: {plugin: nav2_controller::SimpleGoalChecker, xy_goal_tolerance: 0.8, yaw_goal_tolerance: 0.35, stateful: true}
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.15
      lookahead_dist: 0.35
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      min_approach_linear_velocity: 0.05
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.785
      allow_reversing: false
      use_rotate_to_heading: false
      xy_goal_tolerance: 0.25
      stateful: true
behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: [spin, backup, wait]
    spin: {plugin: nav2_behaviors::Spin}
    backup: {plugin: nav2_behaviors::BackUp}
    wait: {plugin: nav2_behaviors::Wait}
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 0.2
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: nav2_waypoint_follower::WaitAtWaypoint, enabled: false}
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.1
      footprint: "[[0.38,0.28],[0.38,-0.28],[-0.38,-0.28],[-0.38,0.28]]"
      plugins: [static_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45, cost_scaling_factor: 3.0}
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      track_unknown_space: true
      resolution: 0.1
      footprint: "[[0.38,0.28],[0.38,-0.28],[-0.38,-0.28],[-0.38,0.28]]"
      plugins: [static_layer, inflation_layer]
      static_layer: {plugin: nav2_costmap_2d::StaticLayer, map_subscribe_transient_local: true}
      inflation_layer: {plugin: nav2_costmap_2d::InflationLayer, inflation_radius: 0.45, cost_scaling_factor: 3.0}
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server, planner_server, controller_server, behavior_server, bt_navigator, waypoint_follower]
