# TartanGround Hospital -> Khronos 输入配置
type: RosInput
tf_verbosity: 1
clear_queue_on_fail: true
inputs:
  left_cam:
    receiver:
      type: ClosedSetImageReceiver
      input_separation_s: 0.04
    sensor:
      type: camera_info
      min_range: 0.1
      max_range: 5.0
      extrinsics:
        type: param
        body_R_sensor:
          w: -0.5
          x: 0.5
          y: -0.5
          z: 0.5
        body_p_sensor: [0.0, 0.0, 0.0]
