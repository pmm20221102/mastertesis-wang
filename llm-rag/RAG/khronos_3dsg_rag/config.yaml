# Khronos 3DSG RAG Configuration

# ============================================================
# 数据源配置
# ============================================================
# 单数据源（build 不加 --all 时使用）
input_dsg: "khronos/scene-graph-khronos/snapshots/2026_06_20-18_30_13/dsg.json"
output_dir: "llm-rag/RAG/khronos_3dsg_rag/outputs"

# 多数据源（build --all 并行构建，每个生成独立数据库）
dsg_sources:
  mock_office: "llm-rag/RAG/khronos_3dsg_rag/data/3DSG.json"
  khronos_office: "khronos/scene-graph-khronos/snapshots/2026_06_20-18_30_13/dsg.json"

# Embedding model (sentence-transformers)
embed_model: "paraphrase-multilingual-MiniLM-L12-v2"

# ChromaDB collection name
collection_name: "scene_graph"

# Keyword aliases for query expansion
aliases:
  door: ["entrance", "exit", "gate"]
  corridor: ["hallway", "passage"]
  room: ["area", "space"]
  table: ["desk"]
  chair: ["seat"]
  person: ["human", "agent"]
  robot: ["agent", "mobile_base"]
  shelf: ["shelving", "rack"]
  wall: ["partition"]
  floor: ["ground", "level"]

# Chinese aliases
zh_aliases:
  门: ["door", "entrance", "exit"]
  走廊: ["corridor", "hallway"]
  房间: ["room"]
  桌子: ["table", "desk"]
  椅子: ["chair", "seat"]
  人: ["person", "human", "agent"]
  机器人: ["robot", "agent"]
  架子: ["shelf", "shelving"]
