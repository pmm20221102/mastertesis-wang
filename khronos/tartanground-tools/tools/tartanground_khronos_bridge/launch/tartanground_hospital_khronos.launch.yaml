# TartanGround Hospital -> Khronos launch file.
#
# Starts only the Khronos node and static TF publishers. Play the bag separately.
#
# Key points:
#   - Ground-truth semantics are enabled by default and use the packaged label/remap configs.
#   - Sensor extrinsics come from ROS TF (`type: ros` in input_config), not uHumans extrinsics.
#   - Static TF provides world->map->odom; the bag provides odom->base_link->camera_optical_frame.
---
launch:
  - arg: {name: use_gt_semantics, default: 'true'}
  - arg: {name: output_dir, default: '$(env HOME)/tartanground_khronos/reports/khronos_output'}
  - arg: {name: start_visualizer, default: 'true', description: 'Set false for headless runs.'}
  - arg: {name: input_config, default: '$(find-pkg-share tartanground_khronos_bridge)/config/tartanground_input.yaml'}
  - arg: {name: mapper_config, default: '$(find-pkg-share tartanground_khronos_bridge)/config/mapper_voxel010_fixed.yaml'}
  - arg: {name: rviz_path, default: '$(find-pkg-share khronos_ros)/config/rviz/uHumans2.rviz'}
  # Frames and sensor range.
  - arg: {name: sensor_frame, default: camera_optical_frame}
  - arg: {name: robot_frame, default: base_link}
  - arg: {name: sensor_min_range, default: '0.1'}
  - arg: {name: sensor_max_range, default: '5.0'}
  # Input topics.
  - arg: {name: rgb_topic, default: /tartanground/front/rgb/image_raw}
  - arg: {name: rgb_info_topic, default: /tartanground/front/rgb/camera_info}
  - arg: {name: depth_topic, default: /tartanground/front/depth/image_raw}
  - arg: {name: label_topic, default: /tartanground/front/semantic/image_raw}
  # Ground-truth label configuration.
  - arg:
      name: labelspace_config
      default: '$(find-pkg-share tartanground_khronos_bridge)/config/tartanground_hospital_label_space.yaml'
      if: $(var use_gt_semantics)
  - arg:
      name: label_remap_config
      default: '$(find-pkg-share tartanground_khronos_bridge)/config/tartanground_hospital_remap.yaml'
      if: $(var use_gt_semantics)
  - let:
      name: extra_yaml
      value: '{semantic_label_remap_filepath: $(var label_remap_config)}'
  # Khronos core node.
  - include:
      file: $(find-pkg-share khronos_ros)/launch/khronos.launch.yaml
      arg:
        - {name: input_config, value: $(var input_config)}
        - {name: labelspace_config, value: $(var labelspace_config)}
        - {name: extra_yaml, value: $(var extra_yaml)}
        - {name: output_dir, value: $(var output_dir)}
        - {name: sensor_min_range, value: $(var sensor_min_range)}
        - {name: sensor_max_range, value: $(var sensor_max_range)}
        - {name: sensor_frame, value: $(var sensor_frame)}
        - {name: robot_frame, value: $(var robot_frame)}
        - {name: rgb_topic, value: $(var rgb_topic)}
        - {name: rgb_info_topic, value: $(var rgb_info_topic)}
        - {name: depth_topic, value: $(var depth_topic)}
        - {name: label_topic, value: $(var label_topic)}
        - {name: use_gt_frame, value: 'true'}
        - {name: evaluate, value: 'false'}
        - {name: start_visualizer, value: $(var start_visualizer)}
        - {name: rviz_path, value: $(var rviz_path)}
        - {name: mapper_config, value: $(var mapper_config)}
  # Static TF: world -> map -> odom (identity), completing the TF tree.
  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: map_static_tf
      args: --child-frame-id map --frame-id world
  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: odom_static_tf
      args: --child-frame-id odom --frame-id map
  # base_link -> camera_optical_frame (R_BASE_OPT). The bag player does not replay
  # /tf_static, so publish this transform here or Khronos cannot resolve extrinsics.
  - node:
      pkg: tf2_ros
      exec: static_transform_publisher
      name: base_optical_static_tf
      args: 0 0 0 0.5 -0.5 0.5 -0.5 base_link camera_optical_frame
