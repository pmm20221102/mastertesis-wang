# A/B Test: save_every_n_frames=0, save_full_state=false
shared_parameters:
  max_range: &max_range 5
  temporal_window: &temporal_window 3
  active_window_threads: &active_window_threads -1
  map_update_frequency: &map_update_frequency 50

finish_processing_on_shutdown: true
save_active_window_objects: false

experiment:
  overwrite: true
  log_timing_details: true
  save_full_state: true  # A/B测试：禁用
  save_every_n_frames: 0  # A/B测试：禁用定期保存

global_frame_name: "world"
default_verbosity: 2
default_num_threads: -1
store_visualization_details: true
verbosity: 3

active_window:
  type: "ActiveWindow"
  verbosity: 2
  min_output_separation: 0.4
  frame_data_buffer:
    max_buffer_size: 300
    store_every_n_frames: 1
  volumetric_map:
    voxel_size: 0.10
    truncation_distance: 0.2
    voxels_per_side: 16
    with_semantics: true
  motion_detector:
    type: "FreeSpaceMotionDetector"
    min_cluster_size: 500
    min_separation_distance: 2
    num_threads: *active_window_threads
    max_range: *max_range
  object_detector:
    type: "ConnectedSemantics"
    min_cluster_size: 50
    use_full_connectivity: true
    use_3d: true
    grid_size: 0.1
    max_range: *max_range
  tracker:
    verbosity: 0
    type: "MaxIouTracker"
    track_by: "voxels"
    min_semantic_iou: 0.25
    min_cross_iou: 0.1
    voxel_size: 0.2
    temporal_window: *temporal_window
    min_num_observations: 15
  projective_integrator:
    num_threads: *active_window_threads
  tracking_integrator:
    temporal_window: *temporal_window
    num_threads: *active_window_threads
  object_extractor:
    type: MeshObjectExtractor
    verbosity: 0
    min_object_allocation_confidence: 0.5
    min_object_volume: 0.005
    max_object_volume: 10.0
    min_dynamic_displacement: 1
    only_extract_reconstructed_objects: true
    min_object_reconstruction_confidence: 0.5
    min_object_reconstruction_observations: 0
    object_reconstruction_resolution: -0.02
    visualize_classification: false
    projective_integrator:
      num_threads: 8

frontend:
  verbosity: 0
  enable_mesh_objects: false
  no_packet_collation: true
  overwrite_mesh_timestamps: true
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 2.5
    mesh_resolution: 0.005
  freespace_places:
    filter_places: true
    min_places_component_size: 3
    filter_ground: false
    gvd:
      max_distance_m: 4.5
      min_distance_m: 0.1
      min_diff_m: 0.1
      min_weight: 1.0e-6
      positive_distance_only: true
      min_basis_for_extraction: 1
      num_buckets: 20
      multi_queue: false
      extract_graph: true
      voronoi_config:
        mode: L1_THEN_ANGLE
        min_distance_m: 0.30
        parent_l1_separation: 20
        parent_cos_angle_separation: 0.2
    graph:
      type: CompressionGraphExtractor
      compression_distance_m: 1.5
      validate_graph: false
      min_node_distance_m: 0.4
      min_edge_distance_m: 0.25
      node_merge_distance_m: 0.7
      add_heuristic_edges: false
      add_overlap_edges: true
      overlap_edges:
        num_neighbors_to_check: 4
        min_clearance_m: 0.4
      add_freespace_edges: false
      merge_policy: distance
    tsdf_interpolator:
      type: downsample
      ratio: 2

backend:
  type: "Backend"
  add_places_to_deformation_graph: false
  optimize_on_lc: true
  enable_node_merging: true
  verbosity: 2
  max_dt_merge_proposal: 3.0
  add_merge_factor: true
  optimize_on_new_merge: true
  pose_object_covariance: 1.0e-01
  object_merge_covariance: 10.0
  pose_object_consistency_threshold: 0.2
  fix_input_pose_variance: 1.0e-02
  fix_input_poses: true
  update_functors:
    khronos_objects:
      type: UpdateKhronosObjectsFunctor
      num_control_points: 3
      control_point_tolerance_s: 10.0
      merge_require_same_label: true
      merge_require_no_co_visibility: true
      merge_min_iou: 0.00001
  change_detection:
    run_every_n_frames: *map_update_frequency
    ray_verificator:
      verbosity: 0
      block_size: 0.5
      radial_tolerance: 0.08
      depth_tolerance: 0.3
      ray_policy: Middle
      active_window_duration: *temporal_window
    ray_change_detector:
      temporal_resolution: 5.0
      window_size: 5
      use_relative_confidence: true
      absence_confidence: 0.6
      presence_confidence: 0.5
    objects:
      type: "RayObjectChangeDetector"
      time_filtering_threshold: *temporal_window
  reconciler:
    verbosity: 0
    time_estimates_conservative: false
    allow_overestimation: true
    merge_object_meshes: true
  pgmo:
    run_mode: MESH_ONLY
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    enable_sparsify: false
    trans_node_dist: 1.0
    rot_node_dist: 1.2
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc:
        fix_odom: false
        inlier_probability: 0.9
        mu_step: 1.6
        max_iterations: 100
    add_initial_prior: true
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
  building_semantic_label: 22
  building_color: [169, 8, 194]
  visualize_place_factors: false
  enable_rooms: true
  room_finder:
    min_dilation_m: 0.5
    max_dilation_m: 1.2
    min_window_size: 0.2
    clip_dilation_window_to_max: false
    min_component_size: 10
    min_room_size: 10
    dilation_threshold_mode: PLATEAU
    min_lifetime_length_m: 0.1
    plateau_ratio: 0.15
    clustering_mode: NEIGHBORS
    max_modularity_iters: 5
    modularity_gamma: 1.0
    room_prefix: R
    dilation_diff_threshold_m: -1.0
    log_filtrations: false
    log_place_graphs: false

lcd:
  lcd_visualizer_ns: /dsg/lcd_visualizer
  lcd_agent_horizon_s: 3.5
  descriptor_creation_horizon_m: 15.0
  lcd:
    enable_agent_registration: true
    place_histogram_config: { min: 0.5, max: 2.5, bins: 30 }
    num_semantic_classes: 20
    object_extraction: { fixed_radius: true, max_radius_m: 13.0 }
    places_extraction: { fixed_radius: true, max_radius_m: 13.0 }
    agent:
      min_time_separation_s: 25.0
      min_score: 0.040
      min_registration_score: 0.01
      max_registration_matches: 2
      min_score_ratio: 0.95
      min_match_separation_m: 0.0
      type: L1
    objects:
      search:
        min_time_separation_s: 25.0
        min_score: 0.3
        min_registration_score: 0.90
        max_registration_matches: 2
        min_score_ratio: 0.9
        min_match_separation_m: 5.0
        type: L1
      registration:
        min_correspondences: 5
        min_inliers: 5
        log_registration_problem: false
        registration_output_path: ""
        recreate_subgraph: false
    places:
      search:
        min_time_separation_s: 25.0
        min_score: 0.2
        min_registration_score: 1.5
        max_registration_matches: 5
        min_score_ratio: 0.7
        min_match_separation_m: 5.0
        type: L1
    teaser:
      estimate_scaling: false
      noise_bound: 0.100
      cbar2: 1.0
      rotation_gnc_factor: 1.4
      rotation_max_iterations: 100
      rotation_cost_threshold: 1.0e-6
      kcore_heuristic_threshold: 0.5
      inlier_selection_mode: PMC_EXACT
      max_clique_time_limit: 3600

visualization:
  color_mode: "color"
  slice_height: -0.5
  slice_height_is_relative: true
  show_unknown_voxels: false
